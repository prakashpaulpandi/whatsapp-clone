# ChatSphere Backend Configuration
server.port=${PORT:8080}

# Database Configuration (Embedded DB by default for zero-setup local running; switches to MySQL when SPRING_DATASOURCE_URL is provided)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:file:./data/chatapp_db;DB_CLOSE_DELAY=-1;AUTO_SERVER=TRUE;MODE=MySQL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=false

# H2 Console (available at http://localhost:8080/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JWT & Security Secrets
jwt.secret=${JWT_SECRET:ChatSphereProductionReadySuperSecretKeyWithAtLeast256BitsLength2026!}

# CORS Configuration
cors.allowed-origins=${ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,http://localhost:8080}

# Logging
logging.level.com.chatapp.chatapp=INFO
logging.level.org.springframework.security=WARN
